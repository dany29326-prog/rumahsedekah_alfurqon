<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Furqon - Rumah Sedekah Digital</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/tT4X06X8/logo-fundraiser-alfurqon.png">
    <meta name="theme-color" content="#059669">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; }
        .hidden { display: none !important; }
        .animate-in { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

<div id="loginPage" class="flex flex-col items-center justify-center min-h-screen p-6 animate-in bg-slate-50">
    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl w-full max-w-sm text-center">
        <div class="w-28 h-28 bg-white rounded-[2.5rem] flex items-center justify-center mx-auto shadow-xl mb-6 border-4 overflow-hidden">
            <img src="https://i.ibb.co.com/wFDBPfFs/Chat-GPT-Image-Apr-30-2026-03-41-39-PM.png" alt="Logo" class="w-full h-full object-contain p-3">
        </div>
        <h1 class="text-3xl font-black text-slate-900 mb-1 uppercase">AL FURQON</h1>
        <p class="text-emerald-700 text-[10px] tracking-[0.3em] font-extrabold uppercase mb-8">Rumah Sedekah Digital</p>
        
        <div class="space-y-4">
            <input type="text" id="nama" placeholder="Nama Petugas" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
            <input type="password" id="password" placeholder="Kata Sandi" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-600 text-sm">
            <button onclick="handleAuth()" id="btnLogin" class="w-full bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-xl active:scale-95 uppercase text-sm">Masuk Sistem</button>
        </div>
    </div>
</div>

<div id="dashboardPage" class="hidden animate-in">
    <div class="bg-emerald-600 p-8 rounded-b-[3.5rem] shadow-lg text-white">
        <p class="text-emerald-100 text-[10px] font-bold uppercase mb-1">Petugas Aktif</p>
        <h2 id="userDisplay" class="text-2xl font-extrabold">---</h2>
    </div>
    <div class="p-6 -mt-8 space-y-6">
        <div class="bg-white p-7 rounded-[2rem] shadow-xl">
            <p class="text-slate-400 text-[10px] font-black uppercase mb-1">Capaian Bulan Ini</p>
            <h3 id="totalBulan" class="text-3xl font-extrabold text-slate-900 mb-4">Rp 0</h3>
            <div class="flex justify-between text-[11px] font-bold uppercase">
                <span class="text-slate-400">Target: <span id="targetDisplay">Rp 0</span></span>
                <span id="hariIniDisplay" class="text-emerald-600">Hari Ini: Rp 0</span>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="toggleForm()" class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col items-center">
                <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600 mb-3"><i class="fa fa-plus"></i></div>
                <span class="text-xs font-black text-slate-700">Donasi Baru</span>
            </button>
            <button onclick="openDonaturPage()" class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col items-center">
                <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-3"><i class="fa fa-users"></i></div>
                <span class="text-xs font-black text-slate-700">Data Donatur</span>
            </button>
            <button onclick="downloadLaporanPDF()" class="bg-white p-6 rounded-[2rem] shadow-sm flex flex-col items-center col-span-2">
                <div class="w-14 h-14 bg-orange-50 rounded-2xl flex items-center justify-center text-orange-600 mb-3"><i class="fa fa-file-pdf"></i></div>
                <span class="text-xs font-black text-slate-700">Download Laporan PDF</span>
            </button>
        </div>
    </div>
</div>

<div id="formDonasi" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] p-8">
        <div class="flex justify-between mb-8">
            <h3 class="text-xl font-extrabold">Input Transaksi</h3>
            <button onclick="toggleForm()"><i class="fa fa-times text-red-500"></i></button>
        </div>
        <div class="space-y-4">
            <select id="jenisDonatur" onchange="aturForm()" class="w-full p-4 bg-slate-50 rounded-2xl font-bold">
                <option value="Umum">Umum (Input Manual)</option>
                <option value="Rutin">Rutin (Cari Database)</option>
            </select>
            <div id="areaInput" class="space-y-4">
                <input type="text" id="namaDonatur" placeholder="Nama Lengkap" class="w-full p-4 bg-slate-50 rounded-2xl">
                <input type="number" id="noHpDonatur" placeholder="WhatsApp (628...)" class="w-full p-4 bg-slate-50 rounded-2xl">
            </div>
            <input type="number" id="nominal" placeholder="Nominal Rp" class="w-full p-4 bg-emerald-50 rounded-2xl font-bold text-emerald-700">
            <select id="kategori" class="w-full p-4 bg-slate-50 rounded-2xl">
                <option value="Infak">Infak</option><option value="Zakat">Zakat</option><option value="Wakaf">Wakaf</option>
            </select>
            <button onclick="handleSubmitDonasi()" id="btnSubmit" class="w-full bg-emerald-600 text-white font-bold py-5 rounded-2xl">SIMPAN & WA</button>
        </div>
    </div>
</div>

<div id="donaturPage" class="hidden min-h-screen p-4">
    <div class="flex justify-between items-center mb-6">
        <button onclick="backToDash()" class="w-10 h-10 bg-white rounded-xl"><i class="fa fa-arrow-left"></i></button>
        <h2 class="text-lg font-black uppercase">Database Donatur</h2>
        <button onclick="tambahDonatur()" class="bg-emerald-600 text-white w-10 h-10 rounded-xl"><i class="fa fa-plus"></i></button>
    </div>
    <input type="text" id="filter" onkeyup="filterDonatur()" placeholder="Cari nama..." class="w-full p-4 rounded-2xl shadow-sm mb-6">
    <div id="listDonatur" class="space-y-3"></div>
</div>

<script>
    // ⚠️ GANTI DENGAN URL DEPLOY GAS TERBARU KAKAK:
    const API_URL = "https://script.google.com/macros/s/AKfycbxPb8st23-daXw0IaL4KyFw4zxAls2QTKi25jFNgjE9Wmn14f5Q9Gr7Vp__17sqCL0GZA/exec"; 
    
    let USER_SESSION = null; let SELECTED_DONATUR = null;

    async function handleAuth() {
        const n = document.getElementById('nama').value; const p = document.getElementById('password').value;
        if(!n || !p) return Swal.fire('Error','Lengkapi data!','warning');
        
        document.getElementById('btnLogin').innerText = "Loading...";
        try {
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', nama: n, password: p }) })).json();
            if(res.success) {
                USER_SESSION = res.data;
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('dashboardPage').classList.remove('hidden');
                document.getElementById('userDisplay').innerText = USER_SESSION.nama;
            } else { Swal.fire('Gagal', res.message, 'error'); }
        } catch(e) { Swal.fire('Error','Gagal server','error'); }
        document.getElementById('btnLogin').innerText = "Masuk Sistem";
    }

    function aturForm() {
        const j = document.getElementById('jenisDonatur').value;
        const c = document.getElementById('areaInput');
        if(j === 'Rutin') {
            c.innerHTML = `<input type="text" id="searchKey" placeholder="Cari..." class="w-full p-4 bg-blue-50 rounded-2xl"><button onclick="cariDB()" class="w-full mt-2 bg-blue-600 text-white p-3 rounded-2xl font-bold">CARI</button><div id="hasil" class="mt-2 text-xs"></div>`;
        } else {
            SELECTED_DONATUR = null;
            c.innerHTML = `<input type="text" id="namaDonatur" placeholder="Nama" class="w-full p-4 bg-slate-50 rounded-2xl mb-4"><input type="number" id="noHpDonatur" placeholder="WA (62...)" class="w-full p-4 bg-slate-50 rounded-2xl">`;
        }
    }

    async function cariDB() {
        const k = document.getElementById('searchKey').value;
        document.getElementById('hasil').innerHTML = "Mencari...";
        try {
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'searchDonatur', keyword: k }) })).json();
            if(res.success && res.data.found) {
                SELECTED_DONATUR = res.data; document.getElementById('hasil').innerHTML = `<b class="text-emerald-600">Ditemukan: ${res.data.nama}</b>`;
            } else { document.getElementById('hasil').innerHTML = "<b class="text-red-500">Tidak ada.</b>"; }
        } catch(e) {}
    }

    async function handleSubmitDonasi() {
        const jenis = document.getElementById('jenisDonatur').value;
        let nama = "", hp = "";
        if(jenis === 'Rutin') {
            if(!SELECTED_DONATUR) return; 
            nama = SELECTED_DONATUR.nama; hp = SELECTED_DONATUR.noHp;
        } else {
            nama = document.getElementById('namaDonatur').value; hp = document.getElementById('noHpDonatur').value;
        }
        
        const nom = document.getElementById('nominal').value; if(!nom) return;
        document.getElementById('btnSubmit').innerText = "Menyimpan...";
        
        try {
            const payload = { action: 'addTransaction', fundraiserId: USER_SESSION.fundraiserId, namaFundraiser: USER_SESSION.nama, jenisDonatur: jenis, namaDonatur: nama, noHpDonatur: hp, nominal: nom, kategori: document.getElementById('kategori').value };
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })).json();
            if(res.success) { window.open(res.data.waLink, '_blank'); location.reload(); }
        } catch(e) { Swal.fire('Gagal','Error sistem','error'); }
    }

    async function openDonaturPage() {
        document.getElementById('dashboardPage').classList.add('hidden'); document.getElementById('donaturPage').classList.remove('hidden');
        document.getElementById('listDonatur').innerHTML = "Loading...";
        try {
            const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getDonaturList' }) })).json();
            if(res.success) {
                document.getElementById('listDonatur').innerHTML = res.data.map(i => `<div class="bg-white p-4 rounded-2xl shadow-sm filter-item"><b>${i[1]}</b><br><small>${i[2]}</small></div>`).join('');
            }
        } catch(e){}
    }

    function tambahDonatur() {
        Swal.fire({ title: 'Donatur Baru', html: `<input id="dn" class="swal2-input" placeholder="Nama"><input id="dp" class="swal2-input" placeholder="WA">`, preConfirm: () => ({ nama: document.getElementById('dn').value, noHp: document.getElementById('dp').value }) })
        .then(async (r) => {
            if(r.isConfirmed) {
                Swal.showLoading();
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addDonatur', nama: r.value.nama, noHp: r.value.noHp }) });
                Swal.fire('Sukses','Tersimpan','success'); openDonaturPage();
            }
        });
    }

    async function downloadLaporanPDF() {
        Swal.showLoading();
        const res = await (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'downloadLaporan', fundraiserId: USER_SESSION.fundraiserId, namaFundraiser: USER_SESSION.nama }) })).json();
        if(res.success) {
            const a = document.createElement('a'); a.href = 'data:application/pdf;base64,' + res.data.base64; a.download = res.data.fileName; a.click(); Swal.close();
        }
    }

    function toggleForm() { document.getElementById('formDonasi').classList.toggle('hidden'); }
    function backToDash() { document.getElementById('donaturPage').classList.add('hidden'); document.getElementById('dashboardPage').classList.remove('hidden'); }
    function filterDonatur() { const k = document.getElementById('filter').value.toUpperCase(); Array.from(document.getElementsByClassName('filter-item')).forEach(i => i.style.display = i.innerText.toUpperCase().includes(k) ? "" : "none"); }
</script>
</body>
</html>
